<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Fixture Covered Offscreen Accordion</title>
    <style>
      html, body { height: 100%; margin: 0; overflow: hidden; }
      #s { box-sizing: border-box; height: 100%; overflow-y: auto; }
      .spacer { height: 2000px; }
      #ov { position: fixed; top: 300px; left: 0; right: 0; height: 100px; background: #ddd; }
    </style>
  </head>
  <body>
    <div id="s">
      <div class="spacer"></div>
      <button type="button" aria-expanded="false" aria-controls="covered-panel">Covered offscreen toggle</button>
      <div id="covered-panel" hidden>Covered expanded content</div>
      <div class="spacer"></div>
    </div>
    <div id="ov"></div>
    <script>
      const toggle = document.querySelector('button');
      const panel = document.querySelector('#covered-panel');
      toggle.addEventListener('click', () => {
        const expanded = toggle.getAttribute('aria-expanded') !== 'true';
        toggle.setAttribute('aria-expanded', String(expanded));
        panel.hidden = !expanded;
      });
    </script>
  </body>
</html>

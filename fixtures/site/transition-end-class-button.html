<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Fixture Transition End Class Button</title>
    <style>
      button { background-color: rgb(240, 240, 240); transition: background-color 200ms linear; }
      button:hover { background-color: rgb(200, 220, 255); }
    </style>
  </head>
  <body>
    <button type="button">Transition end inert</button>
    <script>
      // hover の transition が終わると、自分に class を付ける。click では何もしない。
      const button = document.querySelector('button');
      button.addEventListener('transitionend', () => {
        button.classList.add('transitioned');
      });
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Disabled contrast fixture</title>
    <style>
      body { margin: 0; background-color: rgb(255, 255, 255); font-family: sans-serif; }
      .faint { color: rgb(190, 190, 190); font-size: 16px; }
      #visual-disabled-link { cursor: not-allowed; pointer-events: none; }
      #gradient-text {
        color: rgb(10, 20, 30);
        background-color: transparent;
        background-image: linear-gradient(white, black);
      }
    </style>
  </head>
  <body>
    <main>
      <button id="disabled-button" class="faint" type="button" disabled>Save the form</button>
      <a id="visual-disabled-link" class="faint" href="/navigation-target.html">Looks disabled but is a link</a>
      <p id="faint-text" class="faint">Faint text that is not disabled.</p>
      <p id="gradient-text">Text on a gradient background.</p>
    </main>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Clipped text fixture</title>
    <style>
      #clipped {
        width: 90px;
        height: 24px;
        white-space: nowrap;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <p id="clipped">This deliberately long visible sentence is clipped by its box.</p>
  </body>
</html>

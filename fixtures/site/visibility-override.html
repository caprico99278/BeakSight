<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Visibility override fixture</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; width: 1200px; font-family: sans-serif; background: rgb(255, 255, 255); }
    #hidden-parent { visibility: hidden; }
    #override-visible-text { visibility: visible; color: rgb(10, 90, 40); margin: 0; }
    #inherited-hidden-text { color: rgb(90, 10, 40); margin: 0; }
    #override-visible-outside,
    #inherited-hidden-outside {
      position: absolute;
      left: 1100px;
      width: 80px;
      height: 20px;
    }
    #override-visible-outside { visibility: visible; top: 40px; }
    #inherited-hidden-outside { top: 80px; }
    #aria-hidden-color { color: rgb(30, 30, 160); margin: 0; }
  </style>
</head>
<body>
  <header>Visibility header</header>
  <div id="hidden-parent">
    <p id="inherited-hidden-text">Inherited hidden text</p>
    <p id="override-visible-text">Visible despite a hidden parent</p>
    <div id="override-visible-outside">Visible outside box</div>
    <div id="inherited-hidden-outside">Hidden outside box</div>
  </div>
  <main aria-hidden="true"><p id="aria-hidden-color">ARIA hidden but visible text</p></main>
</body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Preloading Fixture</title>
    <!--
      DEF-023（サイトへの負荷の制御の設計書 4.9）: ページの先読みの指定だけを持つページ。BeakSight の CLI の Chromium の起動では、
      どの先読みの対象のページへの要求も、サーバに届いてはいけない（tests/integration/preloading-disabled.test.ts）。
      先読みの対象のページ（/preloading/ の下の *-target.html）は、それぞれ、この1か所の指定からだけ参照する。リンクも、ほかの
      読み込みもしない。サーバに届いたら、先読みによる要求と分かる。
      - speculation rules の prefetch と prerender（すぐに行う設定。eagerness: immediate）
      - 古い形の先読み（link rel=prefetch、link rel=prerender）
    -->
    <script type="speculationrules">
      {
        "prefetch": [
          { "source": "list", "urls": ["/preloading/prefetch-target.html"], "eagerness": "immediate" }
        ],
        "prerender": [
          { "source": "list", "urls": ["/preloading/prerender-target.html"], "eagerness": "immediate" }
        ]
      }
    </script>
    <link rel="prefetch" href="/preloading/link-prefetch-target.html">
    <link rel="prerender" href="/preloading/link-prerender-target.html">
  </head>
  <body>
    <main>
      <h1>Preloading fixture</h1>
      <p>This page only asks the browser to preload other pages. It has no links.</p>
    </main>
  </body>
</html>

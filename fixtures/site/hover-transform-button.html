<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Fixture Hover Transform Button</title>
    <style>
      body { margin: 8px; }
      /* マウスが乗ると、見た目の大きさだけが変わる。ボタン自身は何もしない。 */
      button:hover { transform: scale(1.2); }
    </style>
  </head>
  <body>
    <button type="button">Hover scale inert</button>
  </body>
</html>

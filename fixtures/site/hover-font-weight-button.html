<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Fixture Hover Font Weight Button</title>
    <style>
      body { margin: 8px; }
      /* マウスが乗った要素の文字が太くなり、ボタンの幅が広がる。ボタン自身は何もしない。 */
      :hover { font-weight: bold; }
    </style>
  </head>
  <body>
    <button type="button">Hover bold inert</button>
  </body>
</html>

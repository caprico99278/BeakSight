<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Fixture Focus State Buttons</title>
  </head>
  <body>
    <button type="button" id="class-focus">Focus class inert</button>
    <button type="button" id="data-focus">Focus data inert</button>
    <script>
      // focus で自分に印を付け、blur で外す（UI の部品集の focus の監視と同じ）。click では何もしない。
      const classButton = document.querySelector('#class-focus');
      classButton.addEventListener('focus', () => classButton.classList.add('cdk-focused'));
      classButton.addEventListener('blur', () => classButton.classList.remove('cdk-focused'));
      const dataButton = document.querySelector('#data-focus');
      dataButton.addEventListener('focus', () => dataButton.setAttribute('data-focused', 'true'));
      dataButton.addEventListener('blur', () => dataButton.removeAttribute('data-focused'));
    </script>
  </body>
</html>

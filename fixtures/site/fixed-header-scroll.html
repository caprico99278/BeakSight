<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Fixed header scroll position fixture</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body { position: relative; height: 1650px; font-family: sans-serif; }
    #fixed-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 80px;
      background: rgb(20, 20, 20);
      color: rgb(255, 255, 255);
    }
    .positioned-heading { position: absolute; left: 16px; height: 30px; margin: 0; }
    #top-heading { top: 120px; }
    #lower-heading-1 { top: 1060px; }
    #lower-heading-2 { top: 1100px; }
    #below-fold-text {
      position: absolute;
      top: 1300px;
      left: 16px;
      width: 200px;
      height: 40px;
      margin: 0;
      color: rgb(90, 30, 120);
      background: rgb(250, 250, 250);
    }
  </style>
</head>
<body>
  <div id="fixed-header">Site header</div>
  <h1 id="top-heading" class="positioned-heading">Top heading</h1>
  <h2 id="lower-heading-1" class="positioned-heading">Lower heading one</h2>
  <h2 id="lower-heading-2" class="positioned-heading">Lower heading two</h2>
  <p id="below-fold-text">Below the fold text.</p>
</body>
</html>

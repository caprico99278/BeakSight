<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Fixture Delete Request</title>
  </head>
  <body>
    <h1>Fixture Delete Request</h1>
    <button type="button" id="send-delete">Send DELETE</button>
    <script>
      // ボタンを押すと DELETE を送る（Task 18 の S02）。Interaction 中は、サーバに届いてはいけない。
      document.querySelector('#send-delete').addEventListener('click', () => {
        void fetch('/__mutation', { method: 'DELETE' }).catch(() => undefined);
      });
    </script>
  </body>
</html>

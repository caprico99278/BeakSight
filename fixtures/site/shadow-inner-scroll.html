<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Inner scroll container in an open shadow root fixture</title>
  <style>
    /* body の余白は既定（8px）のまま。文書は余白の分だけスクロールできるが、本文は shadow root の中の領域がスクロールする。 */
    body { font-family: sans-serif; }
  </style>
</head>
<body>
  <div id="shadow-host"></div>
  <script>
    const root = document.getElementById('shadow-host').attachShadow({ mode: 'open' });
    root.innerHTML = '<div id="app-shell" style="height:100vh;overflow:auto">'
      + '<div style="height:5000px"><h1>Inner scroll container in an open shadow root fixture</h1></div>'
      + '</div>';
  </script>
</body>
</html>
